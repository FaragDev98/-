<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FR Webs — الكورس</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- ====== الهيرو ====== -->
<section class="hero">
  <h1>ابدأ رحلتك في البرمجة</h1>
  <p>تعلم من الصفر وابدأ تحقق دخل من الإنترنت</p>

  <!-- فيديو تعريفي -->
  <div class="video-box">
    <iframe src="https://www.youtube.com/embed/04fbjvVF7Cw" allowfullscreen></iframe>
  </div>

  <!-- زر الشراء -->
  <button class="buy-btn"
    data-service="كورس البرمجة الكامل"
    data-price="50">
    اشترك الآن
  </button>
</section>

<!-- ====== فيديوهات الكورس ====== -->
<section class="videos">
  <h2>محتوى الكورس</h2>

  <div class="video-list">

    <div class="video-card">
      <iframe src="https://www.youtube.com/embed/04fbjvVF7Cw"></iframe>
      <p>الدرس 1 - مقدمة</p>
    </div>

    <div class="video-card">
      <iframe src="https://www.youtube.com/embed/04fbjvVF7Cw"></iframe>
      <p>الدرس 2 - HTML</p>
    </div>

    <div class="video-card">
      <iframe src="https://www.youtube.com/embed/04fbjvVF7Cw"></iframe>
      <p>الدرس 3 - CSS</p>
    </div>

  </div>
</section>

<!-- ====== المميزات ====== -->
<section class="features">
  <h2>هتتعلم ايه؟</h2>

  <div class="grid">
    <div>💻 تصميم مواقع</div>
    <div>📱 شغل بالموبايل</div>
    <div>💰 ربح من الإنترنت</div>
    <div>🚀 تبدأ مشروعك</div>
  </div>
</section>

<!-- ====== الدفع ====== -->
<div class="payment-modal" id="paymentModal">

  <div class="payment-box">

    <span class="close" onclick="closePayment()">✖</span>

    <h3 id="serviceTitle"></h3>

    <div class="methods">

      <div class="pay-item" data-method="فودافون كاش">فودافون كاش</div>
      <div class="pay-item" data-method="أورنج كاش">أورنج كاش</div>
      <div class="pay-item" data-method="وي كاش">وي كاش</div>
      <div class="pay-item" data-method="PayPal">PayPal</div>

    </div>

    <input id="userNumber" placeholder="رقمك">
    <input type="file" id="payProof">

    <button id="confirmBtn">تأكيد الدفع</button>

    <p id="payStatus"></p>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
