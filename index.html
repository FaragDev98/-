<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<!-- ربط ملف CSS -->

</head>

<body>

  <!-- الفيديو -->
  <div class="video-box">
    <iframe 
      src="https://www.youtube.com/embed/Q7lK-mSIP24"
      title="YouTube video"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>
  <!-- أيقونات السوشيال -->
  <div class="social-icons">
     <a href="https://www.facebook.com/share/14UdskYJC74/" target="_blank">
      <img src="icons/facebook.png">
      <span>تابع</span>
     </a>
    <a href="https://www.linkedin.com/in/factory-course-43a655358" target="_blank">
      <img src="icons/linkedin.png">
      <span>تابع</span>
    </a>
    <a href="https://www.instagram.com/frjbdllh25" target="_blank">
      <img src="icons/instagram.png">
      <span>تابع</span>
    </a>
    <a href="https://www.tiktok.com/@fr.webs?_r=1&_t=ZS-950tLswi3W8" target="_blank">
      <img src="icons/i-icon.png">
      <span>تابع</span>
    </a>
 <a href="https://www.youtube.com/@Fabrica-courses" class="follow-btn">
  <img src="icons/youtube.png">
  <span>🔔 اشترك</span>
 </a>
   
</section>



<!-- ================= الخدمات ================= -->
<section class="services">

  <div class="card">
    <h2>🔥 كورس FR Webs</h2>
    <p>تعلم تصميم مواقع + Freelance</p>
    <button class="buy-btn" data-service="كورس FR Webs" data-price="200">
      شراء الآن
    </button>
  </div>

  <div class="card">
    <h2>📘 كتاب HTML</h2>
    <p>تعلم HTML من الصفر</p>
    <button class="buy-btn" data-service="كتاب HTML" data-price="100">
      شراء الآن
    </button>
  </div>

  <div class="card">
    <h2>💻 موقع جاهز</h2>
    <p>نصمم لك موقع احترافي</p>
    <button class="buy-btn" data-service="موقع كامل" data-price="1000">
      اطلب الآن
    </button>
  </div>

</section>


<!-- ================= POPUP ================= -->
<div class="popup" id="popup">
  <div class="popup-box">

    <span class="close" onclick="closePopup()">✖</span>

    <h2 id="title"></h2>
    <p id="desc"></p>

    <button onclick="openPayment()" class="pay-btn">
      إتمام الشراء 💳
    </button>

  </div>
</div>


<!-- ================= PAYMENT ================= -->
<div class="payment" id="payment">
  <div class="payment-box">

    <h3 id="payTitle"></h3>
    <p>اختر طريقة الدفع</p>

    <button onclick="pay()">تأكيد الدفع</button>

  </div>
</div>


<!-- سكربت يوتيوب (مهم جدًا) -->
<script src="https://apis.google.com/js/platform.js" defer></script>

<!-- ملف الجافاسكربت -->
<script src="footer.js"></script>

</body>
</html>
